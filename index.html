<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="App">
<meta name="theme-color" content="#161514">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="icon" href="icon-192.png?v=3">
<title>App</title>
<style>
html,body{margin:0;height:100%;background:#161514;color:#f2ede4;font:16px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-text-size-adjust:100%}
form{position:fixed;inset:0;display:grid;place-content:center;gap:12px;padding:24px;width:min(320px,calc(100vw - 48px));margin:auto}
form[hidden]{display:none}
input{height:50px;padding:0 18px;border:0;border-radius:18px;background:rgba(255,255,255,.08);color:inherit;font:inherit;font-size:17px;outline:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
input:focus{box-shadow:inset 0 0 0 1.5px #d97757}
button{height:50px;border:0;border-radius:18px;background:#d97757;color:#fff;font:600 16px -apple-system,system-ui,sans-serif}
button:disabled{opacity:.5}
p{margin:0;min-height:20px;text-align:center;color:#9a9184;font-size:14px}
html,body{transition:background-color .5s ease}
#s{position:fixed;top:-120px;bottom:-120px;left:0;right:0;background:var(--sb,#161514);box-shadow:0 0 0 100vmax var(--sb,#161514);transition:background-color .5s ease,box-shadow .5s ease}
#s[hidden]{display:none}
#s svg{position:absolute;left:50%;top:calc(var(--sy,calc(50% - 120px)) + 120px);width:108px;height:72px;margin:-36px 0 0 -54px;transition:opacity .5s ease}
html.ios0 #s{--sb:#000}
html.ios0 #s svg{opacity:0}
</style>
</head>
<body>
<div id="s"><svg viewBox="0 0 12 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#e78d6d" d="M3 0h6v1H3zM2 1h8v1H2zM1 2h10v4H1zM0 6h12v1H0zM1 7h10v1H1z"/><path fill="#1c1b19" d="M4 4h1v1H4zM7 4h1v1H7z"/></svg></div>
<form id="f" hidden>
<input type="text" name="username" autocomplete="username" value="app" hidden>
<input id="p" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Codice">
<button id="b">Entra</button>
<p id="e"></p>
</form>
<script>
(function(){window.__t0=Date.now();
const R=document.documentElement;
let B='#161514';try{const b=localStorage.getItem('b');if(/^#[0-9a-f]{6}$/i.test(b||'')){B=b;R.style.setProperty('--sb',b);R.style.background=document.body.style.background=b}}catch(e){}
if(navigator.standalone===true&&Math.min(screen.width,screen.height)<600){const h=matchMedia('(orientation: landscape)').matches?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);
  R.style.setProperty('--sy',h/2+'px');R.classList.add('ios0');R.style.background=document.body.style.background='#000';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{R.classList.remove('ios0');R.style.background=document.body.style.background=B}))}
const S='e4c4687219bc7db474f6485696784900',N=600000,$=i=>document.getElementById(i);
const hex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const b64=u=>btoa(String.fromCharCode(...u)),unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function derive(pw){const t=new TextEncoder().encode(pw.normalize('NFC').toLowerCase().trim().replace(/\s+/g,' '));
  const m=await crypto.subtle.importKey('raw',t,'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:hex(S),iterations:N},m,256))}
async function open(k,buf){const u=new Uint8Array(buf);if(u[0]!==1)throw new Error('formato');
  const key=await crypto.subtle.importKey('raw',k,'AES-GCM',false,['decrypt']);
  const x=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(1,13)},key,u.slice(13));
  return await new Response(new Blob([x]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
async function seal(k,o){const key=await crypto.subtle.importKey('raw',k,'AES-GCM',false,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12));
  const z=new Uint8Array(await new Response(new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,z)),u=new Uint8Array(13+c.length);u[0]=1;u.set(iv,1);u.set(c,13);return u}
async function get(n){try{const r=await fetch(n,{cache:'no-cache'});if(r.ok)return await r.arrayBuffer()}catch(e){}
  if('caches' in window){const c=await caches.match(n);if(c)return await c.arrayBuffer()}throw new Error('rete')}
async function boot(k,keep){const page=await open(k,await get('a.bin'));if(keep)try{localStorage.setItem('k',b64(k))}catch(e){}
  window.__d=async(m,x)=>{if(m==='seal')return seal(k,x);if(m==='unseal')return JSON.parse(await open(k,x));if(m==='cache'){if(!('caches' in window))return null;const c=await caches.match('d.bin');return c?JSON.parse(await open(k,await c.arrayBuffer())):null}
    const r=await fetch('d.bin',{cache:'no-store'});if(!r.ok)throw new Error(r.status);return JSON.parse(await open(k,await r.arrayBuffer()))};
  const w=520-(Date.now()-window.__t0);if(w>0)await new Promise(r=>setTimeout(r,w));
  document.open();document.write(page);document.close()}
function ask(msg){$('s').hidden=true;document.documentElement.style.background=document.body.style.background='';const f=$('f');f.hidden=false;$('e').textContent=msg||'';$('b').disabled=false;setTimeout(()=>$('p').focus(),50)}
$('f').addEventListener('submit',async ev=>{ev.preventDefault();const pw=$('p').value;if(!pw.trim())return;$('b').disabled=true;$('e').textContent='…';
  try{await boot(await derive(pw),true)}
  catch(e){$('p').value='';ask(e&&e.message==='rete'?'Senza rete. Riprova.':'Codice non valido.')}});
if('serviceWorker' in navigator&&isSecureContext)navigator.serviceWorker.register('sw.js').catch(()=>{});
let k=null;try{const t=localStorage.getItem('k');if(t)k=unb64(t)}catch(e){}
if(!k){ask();return}
boot(k).catch(e=>{if(e&&e.message==='rete'){$('s').hidden=true;document.body.innerHTML='<form style="display:grid"><p>Senza rete.</p><button type="button" onclick="location.reload()">Riprova</button></form>';return}
  try{localStorage.removeItem('k')}catch(x){}ask()});
})();
</script>
</body>
</html>
